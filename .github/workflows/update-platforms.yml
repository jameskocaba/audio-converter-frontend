name: Update Supported Platforms

on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch: 

permissions:
  contents: write 

# Opts into Node.js 24 early to silence the deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-html:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run health check script
        run: python update_supported_sites.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add supported-sites.html
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update supported-sites.html with active platforms" && git push)
